name: release-067
on:
  push:
    branches: [v0.6.7-dev]
    paths: ['.github/workflows/release-067.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v0.6.7-dev}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Syntax checks
        run: |
          cd scratch-0.6.7/base
          node --check server.mjs
          node --check src/minions.mjs
          node --check public/minions.js
      - name: Search ranking regression
        run: |
          cd scratch-0.6.7/base
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { calculateMinionRankings } from './src/minions.mjs';
          import { MINION_DATA } from './src/minion-data.mjs';

          const ids=new Set();
          const add=(id)=>{if(id&&String(id).toUpperCase()!=='COINS')ids.add(String(id));};
          for(const m of Object.values(MINION_DATA.definitions||{})){
            for(const t of Object.values(m.tiers||{}))for(const e of t.recipe||[])add(e.item);
            for(const d of m.drops||[]){add(d.item);for(const x of Object.keys(d.enchanted||{}))add(x);}
          }
          for(const [id,f] of Object.entries(MINION_DATA.fuels||{})){add(id);add(f.itemId);}
          for(const [id,u] of Object.entries(MINION_DATA.upgrades||{})){add(id);if(u.cooldownDrop)add(u.cooldownDrop.item);for(const d of u.extraDrops||[])add(d.item);}
          const market={},history=new Map();
          for(const id of ids){
            market[id]={buy_summary:[{pricePerUnit:100}],sell_summary:[{pricePerUnit:110}],quick_status:{buyPrice:100,sellPrice:110}};
            const h={};for(let d=1;d<=7;d++){h['samples'+d+'d']=d*288;h['coverage'+d+'d']=1;h['avgBuy'+d+'d']=95;h['avgSell'+d+'d']=105;h['cvMid'+d+'d']=0.02;}history.set(id,h);
          }
          const base={tier:11,count:1,fuel:'ENCHANTED_LAVA_BUCKET',sellMethod:'BEST',priceMode:'LIVE',compareDays:5,collectionIntervalDays:1,family:'ALL',sort:'NET',beaconPercent:0,crystalPercent:0,otherSpeedPercent:0};
          const ctx={market,historyStats:history,itemMeta:new Map(),taxRate:0.0125};
          const all=calculateMinionRankings({...base,search:''},ctx);
          const cowAll=all.rows.find(r=>r.name==='Cow Minion');
          assert.ok(cowAll?.sortRank>0,'Cow must have a global rank');
          const filtered=calculateMinionRankings({...base,search:'cow'},ctx);
          assert.equal(filtered.rows.length,1,'search should display only Cow');
          assert.equal(filtered.rows[0].name,'Cow Minion');
          assert.equal(filtered.rows[0].sortRank,cowAll.sortRank,'search must preserve the global rank');
          assert.equal(filtered.totalRankedRows,all.totalRankedRows,'search must not change ranking population');
          console.log('global rank preserved:',cowAll.sortRank,'of',all.totalRankedRows);
          NODE
      - name: Build update bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json,datetime,shutil
          repo=Path('.');src=repo/'scratch-0.6.7'/'base'
          files=['server.mjs','package.json','config.example.json','src/db.mjs','src/apply-update.mjs','src/history-stats-worker.mjs','src/minions.mjs','src/minion-data.mjs','public/index.html','public/minions.html','public/minions.js','public/minions.css']
          payload={'files':{rel:base64.b64encode((src/rel).read_bytes()).decode() for rel in files}}
          zipped=gzip.compress(json.dumps(payload,separators=(',',':')).encode(),compresslevel=9)
          b64=base64.b64encode(zipped).decode();out=repo/'releases'/'0.6.7'
          if out.exists():shutil.rmtree(out)
          out.mkdir(parents=True)
          parts=[]
          for i in range(0,len(b64),8000):
            name=f'part-{i//8000+1:03d}.txt';(out/name).write_text(b64[i:i+8000]);parts.append(f'./releases/0.6.7/{name}')
          notes=['Minion search now filters only what is displayed; it no longer recalculates the ranking using only matching results.','The # column preserves each minion’s rank from the full selected ranking population, so searching for one minion still shows how profitable it is relative to the others.','Adds a regression test to ensure search never changes a minion’s global rank.']
          manifest={'version':'0.6.7','publishedAt':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=3))).isoformat(timespec='seconds'),'notes':notes,'files':[],'bundle':{'parts':parts,'encoding':'gzip-base64','sha256':hashlib.sha256(zipped).hexdigest()}}
          for rel in files:manifest['files'].append({'path':rel,'sha256':hashlib.sha256((src/rel).read_bytes()).hexdigest()})
          (repo/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Commit release
        run: |
          git config user.name bazaarflipper-update-bot
          git config user.email actions@users.noreply.github.com
          git rm -rf scratch-0.6.7 .github/workflows
          git add manifest.json releases/0.6.7
          git commit -m "release: BazaarFlipper v0.6.7"
          git push origin HEAD:v0.6.7-dev
