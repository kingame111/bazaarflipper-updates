name: release-066
on:
  push:
    branches: [v0.6.6-dev]
    paths: ['.github/workflows/release-066.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v0.6.6-dev}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Syntax checks
        run: |
          cd scratch-0.6.6/base
          node --check server.mjs
          node --check src/db.mjs
          node --check src/apply-update.mjs
          node --check src/minions.mjs
          node --check public/minions.js
      - name: Minion regression checks
        run: |
          cd scratch-0.6.6/base
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { calculateMinionRankings } from './src/minions.mjs';
          import { MINION_DATA } from './src/minion-data.mjs';

          const ids=new Set();
          const add=(id)=>{if(id&&String(id).toUpperCase()!=='COINS')ids.add(String(id));};
          for(const m of Object.values(MINION_DATA.definitions||{})){
            for(const t of Object.values(m.tiers||{}))for(const e of t.recipe||[])add(e.item);
            for(const d of m.drops||[]){add(d.item);for(const x of Object.keys(d.enchanted||{}))add(x);}
          }
          for(const [id,f] of Object.entries(MINION_DATA.fuels||{})){add(id);add(f.itemId);}
          for(const [id,u] of Object.entries(MINION_DATA.upgrades||{})){
            add(id);
            for(const d of u.extraDrops||[]){add(d.item);for(const x of Object.keys(d.enchanted||{}))add(x);}
            if(u.cooldownDrop){add(u.cooldownDrop.item);for(const x of Object.keys(u.cooldownDrop.enchanted||{}))add(x);}
            for(const t of u.dropTransforms||[]){add(t.from);add(t.to);for(const x of Object.keys(t.enchanted||{}))add(x);}
          }
          for(const [id,n] of Object.entries(MINION_DATA.compactionNext||{})){add(id);add(n.item);}

          const market={};
          const history=new Map();
          for(const id of ids){
            market[id]={product_id:id,buy_summary:[{pricePerUnit:100,amount:100000}],sell_summary:[{pricePerUnit:110,amount:100000}],quick_status:{buyPrice:100,sellPrice:110}};
            const h={};
            for(let d=1;d<=7;d++){
              h['samples'+d+'d']=d*288;h['coverage'+d+'d']=1;h['avgBuy'+d+'d']=95;h['avgSell'+d+'d']=105;h['cvMid'+d+'d']=0.02;
            }
            history.set(id,h);
          }

          const result=calculateMinionRankings({
            tier:11,count:1,fuel:'ENCHANTED_LAVA_BUCKET',sellMethod:'BEST',priceMode:'LIVE',
            compareDays:5,collectionIntervalDays:1,family:'ALL',search:'',sort:'NET',
            beaconPercent:0,crystalPercent:0,otherSpeedPercent:0
          },{market,historyStats:history,itemMeta:new Map(),taxRate:0.0125,marketUpdatedAt:Date.now()});

          const supported=result.rows.filter(r=>r.supported);
          assert.ok(supported.length>40,'expected supported minion rows');
          assert.ok(supported.every(r=>r.tier===11),'every row must use requested Tier 11');
          assert.ok(supported.every(r=>r.compareDays===5),'every row must use selected 5-day comparison');
          assert.ok(supported.every(r=>Math.abs((r.grossDay-r.bazaarTaxDay-r.expensesDay)-r.netDay)<1e-6),'gross-tax-recurring must equal net');
          assert.ok(supported.every(r=>!((r.upgrades||[]).some(x=>x.id==='SOULFLOW_ENGINE')&&(r.upgrades||[]).some(x=>x.id==='LESSER_SOULFLOW_ENGINE'))),'Soulflow variants must not stack');
          const cow=supported.find(r=>r.name==='Cow Minion');
          assert.ok(cow,'Cow Minion missing');
          assert.equal(cow.setupComplete,true,'Cow T11 setup should be priceable with complete market data');
          assert.ok(Number.isFinite(cow.currentVsHistoryPercent),'LIVE-vs-history comparison should calculate');
          console.log('minion regression checks passed:',supported.length,'rows');
          NODE
      - name: Build update bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json,datetime,shutil
          repo=Path('.'); src=repo/'scratch-0.6.6'/'base'
          files=['server.mjs','package.json','config.example.json','src/db.mjs','src/apply-update.mjs','src/history-stats-worker.mjs','src/minions.mjs','src/minion-data.mjs','public/index.html','public/minions.html','public/minions.js','public/minions.css']
          payload={'files':{}}
          for rel in files: payload['files'][rel]=base64.b64encode((src/rel).read_bytes()).decode()
          zipped=gzip.compress(json.dumps(payload,separators=(',',':')).encode(),compresslevel=9)
          b64=base64.b64encode(zipped).decode()
          out=repo/'releases'/'0.6.6'
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)
          parts=[]
          for i in range(0,len(b64),8000):
              name=f'part-{i//8000+1:03d}.txt'; (out/name).write_text(b64[i:i+8000],encoding='utf-8'); parts.append(f'./releases/0.6.6/{name}')
          notes=[
            'Adds Bazaar-style hover explanations to every Minion Calculator table column.',
            'Fixes the first-load Tier mismatch that could show Tier 11 in the control while calculating Tier 1 rows.',
            'Compares LIVE and historical prices using the exact same winning minion setup instead of optimizing two different setups.',
            'Prevents Soulflow Engine and Lesser Soulflow Engine from being equipped together.',
            'Splits true gross revenue, Bazaar tax, recurring cost and net profit into separate values.',
            'Automatically refreshes History products and Reliable history when the background history calculation finishes.',
            'Limits the LIVE comparison selector to the number of reliable history days currently available.',
            'Adds stale-request guards so older calculations cannot overwrite newer settings.',
            'Improves Windows update restart reliability by launching server.mjs directly, with batch fallback and detailed restart logging.'
          ]
          manifest={'version':'0.6.6','publishedAt':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=3))).isoformat(timespec='seconds'),'notes':notes,'files':[],'bundle':{'parts':parts,'encoding':'gzip-base64','sha256':hashlib.sha256(zipped).hexdigest()}}
          for rel in files: manifest['files'].append({'path':rel,'sha256':hashlib.sha256((src/rel).read_bytes()).hexdigest()})
          (repo/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit release
        run: |
          git config user.name bazaarflipper-update-bot
          git config user.email actions@users.noreply.github.com
          git rm -rf scratch-0.6.6 .github/workflows
          git add manifest.json releases/0.6.6
          git commit -m "release: BazaarFlipper v0.6.6"
          git push origin HEAD:v0.6.6-dev
