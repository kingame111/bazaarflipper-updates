name: Hypixel live contract audit (external API)
on:
  push:
    branches: [stabilization/v0.7.0-foundation]
    paths:
      - tests/hypixel-live-v0.7.0.mjs
      - .github/workflows/hypixel-live-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Request three public Hypixel APIs once each
        run: node tests/hypixel-live-v0.7.0.mjs
