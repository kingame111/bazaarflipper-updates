name: Audit minion calculator 0.6.10
on:
  push:
    branches: [audit-minions-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minion-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate audit script syntax
        run: node --check tests/minion-audit-20261010.mjs
      - name: Run synthetic audit across minion families, all tiers, all fuel and upgrades
        run: node tests/minion-audit-20261010.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minion-audit-results
          path: minion-audit-results.json
