name: Verify BazaarFlipper minions v0.6.11
on:
  push:
    branches: [feature/minions-v0.6.11]
    paths:
      - candidate-src/**
      - tests/minions-v0.6.11.test.mjs
      - tests/minion-audit-v0.6.11.mjs
      - scripts/package-v0.6.11.mjs
      - .github/workflows/minions-v0.6.11.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify minion economics and data integrity
        run: node tests/minions-v0.6.11.test.mjs
      - name: Build complete signed update bundle
        run: node scripts/package-v0.6.11.mjs
      - name: Run complete synthetic setup matrix
        run: |
          node tests/minion-audit-v0.6.11.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('minion-audit-results.json','utf8'));
          if(r.sourceFamilyCount!==61)throw Error('Unexpected minion family count');
          if(r.scenariosExecuted<49000)throw Error('Too few regression cases');
          const critical=(r.issues||[]).filter(i=>['EXECUTION_FAIL','INVARIANT_FAIL','TWO_SLOT_FUEL_COMBINATIONS'].includes(i.id));
          if(critical.length)throw Error('Minion regressions: '+JSON.stringify(critical));
          console.log('FULL MATRIX PASS',r.scenariosExecuted,'scenarios');
          NODE
      - name: Commit candidate package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/0.6.11/ manifest.json
          git diff --cached --quiet || (git commit -m "Package verified BazaarFlipper minion v0.6.11 candidate" && git push)
