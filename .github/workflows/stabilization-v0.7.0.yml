name: BazaarFlipper v0.7.0 stabilization candidate
on:
  push:
    branches: [stabilization/v0.7.0-foundation]
    paths:
      - candidate-src/**
      - tests/runtime-manager-v0.7.0.test.mjs
      - tests/legacy-v0613-upgrade-v0.7.0.test.mjs
      - tests/handoff-db-v0.7.0.test.mjs
      - tests/sync-integrity-v0.7.0.test.mjs
      - tests/minion-quality-v0.7.0.test.mjs
      - tests/market-contract-v0.7.0.test.mjs
      - tests/minion-recursive-v0.7.0.test.mjs
      - tests/no-data-loss-v0.7.0.test.mjs
      - tests/two-server-sync-v0.7.0.test.mjs
      - tests/browser-smoke-v0.7.0.test.mjs
      - tests/full-runtime-smoke-v0.7.0.mjs
      - scripts/package-v0.7.0.mjs
      - .github/workflows/stabilization-v0.7.0.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate standalone supervisor and startup files
        run: |
          node --check candidate-src/runtime-manager.mjs
          node --check candidate-src/public/update-client.js
          node --check candidate-src/server.mjs
      - name: Test independent update, interruption, and rollback
        run: node tests/runtime-manager-v0.7.0.test.mjs
      - name: Upgrade a disposable v0.6.13 installation with its old installer
        run: node tests/legacy-v0613-upgrade-v0.7.0.test.mjs
      - name: WAL-consistent full database handoff, transaction rollback and streaming caps
        run: node tests/handoff-db-v0.7.0.test.mjs
      - name: Test sync receipts, collisions and tampered replays
        run: node tests/sync-integrity-v0.7.0.test.mjs
      - name: Enforce no-deletion policy for unacknowledged history
        run: node tests/no-data-loss-v0.7.0.test.mjs
      - name: Verify Hypixel contracts and Bazaar/minion price sides
        run: node tests/market-contract-v0.7.0.test.mjs
      - name: Test nested Slayer minion ingredient recipes
        run: node tests/minion-recursive-v0.7.0.test.mjs
      - name: Minion economics regressions
        run: |
          node tests/minions-v0.6.11.test.mjs
          node tests/minion-audit-v0.6.11.mjs
  runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test independent update and rollback on Windows
        shell: pwsh
        run: node tests/runtime-manager-v0.7.0.test.mjs
      - name: Test 0.6.13 to 0.7.0 bridge using the old Windows updater
        shell: pwsh
        run: node tests/legacy-v0613-upgrade-v0.7.0.test.mjs
      - name: Verify full SQLite handoff safety on Windows
        shell: pwsh
        run: node tests/handoff-db-v0.7.0.test.mjs
      - name: Test collision handling on Windows
        shell: pwsh
        run: node tests/sync-integrity-v0.7.0.test.mjs
      - name: Test no data loss on Windows
        shell: pwsh
        run: node tests/no-data-loss-v0.7.0.test.mjs
      - name: Test Hypixel price-side and economic invariants on Windows
        shell: pwsh
        run: node tests/market-contract-v0.7.0.test.mjs
      - name: Test recursive minion economics on Windows
        shell: pwsh
        run: node tests/minion-recursive-v0.7.0.test.mjs

  two-servers-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run two real servers and sync 176,000 rows with offline retry
        run: node tests/two-server-sync-v0.7.0.test.mjs
  two-servers-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Two servers with 700 snapshots and 2200 products each
        env:
          BAZAAR_SYNC_SNAPSHOTS: '700'
          BAZAAR_SYNC_PRODUCTS: '2200'
        run: node tests/two-server-sync-v0.7.0.test.mjs
  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install headless Chromium test tooling
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Exercise actual Bazaar and Minion Calculator pages in Chromium
        run: node tests/browser-smoke-v0.7.0.test.mjs
  package-candidate:
    needs: [runtime-linux, runtime-windows, two-servers-linux, two-servers-stress, browser-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check minion quality and calculation worker equivalence
        run: node tests/minion-quality-v0.7.0.test.mjs
      - name: Package the exact tested source tree
        run: node scripts/package-v0.7.0.mjs
      - name: Boot the complete packaged application on Linux
        run: node tests/full-runtime-smoke-v0.7.0.mjs
      - name: Recheck 1.54-million-row historical calculation
        run: node tests/reliability-v0.6.13.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-v0-7-0
          path: |
            manifest.json
            releases/0.7.0/*.txt
          retention-days: 7
  full-windows:
    needs: package-candidate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: verified-v0-7-0
          path: .
      - name: Boot the full release bundle on Windows
        shell: pwsh
        run: node tests/full-runtime-smoke-v0.7.0.mjs
  publish-candidate:
    needs: [package-candidate, full-windows]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/download-artifact@v4
        with:
          name: verified-v0-7-0
          path: .
      - name: Save bundle to candidate branch only — never main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json releases/0.7.0/
          git fetch origin stabilization/v0.7.0-foundation
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Candidate advanced since this test; skip publishing stale artifacts"
            exit 0
          fi
          git diff --cached --quiet || (git commit -m "Package verified BazaarFlipper v0.7.0 candidate" && git push origin HEAD:refs/heads/stabilization/v0.7.0-foundation)
