name: BazaarFlipper v0.7.0 stabilization candidate
on:
  push:
    branches: [stabilization/v0.7.0-foundation]
    paths:
      - candidate-src/**
      - tests/runtime-manager-v0.7.0.test.mjs
      - scripts/package-v0.7.0.mjs
      - .github/workflows/stabilization-v0.7.0.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate standalone supervisor and startup files
        run: |
          node --check candidate-src/runtime-manager.mjs
          node --check candidate-src/public/update-client.js
          node --check candidate-src/server.mjs
      - name: Test independent update, interruption, and rollback
        run: node tests/runtime-manager-v0.7.0.test.mjs
  runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test independent update and rollback on Windows
        shell: pwsh
        run: node tests/runtime-manager-v0.7.0.test.mjs
