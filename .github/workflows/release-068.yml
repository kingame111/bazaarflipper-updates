name: release-068
on:
  push:
    branches: [v0.6.8-dev]
    paths: ['.github/workflows/release-068.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v0.6.8-dev}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Syntax checks
        run: |
          cd scratch-0.6.8/base
          node --check server.mjs
          node --check src/db.mjs
          node --check src/apply-update.mjs
          node --check src/minions.mjs
          node --check public/minions.js
          test -f start-bazaarflip.bat
          grep -q 'node "%~dp0server.mjs"' start-bazaarflip.bat
      - name: Build update bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json,datetime,shutil
          repo=Path('.');src=repo/'scratch-0.6.8'/'base'
          files=[
            'server.mjs','package.json','config.example.json',
            'src/db.mjs','src/apply-update.mjs','src/history-stats-worker.mjs','src/minions.mjs','src/minion-data.mjs',
            'public/index.html','public/minions.html','public/minions.js','public/minions.css',
            'start-bazaarflip.bat'
          ]
          payload={'files':{rel:base64.b64encode((src/rel).read_bytes()).decode() for rel in files}}
          zipped=gzip.compress(json.dumps(payload,separators=(',',':')).encode(),compresslevel=9)
          b64=base64.b64encode(zipped).decode();out=repo/'releases'/'0.6.8'
          if out.exists():shutil.rmtree(out)
          out.mkdir(parents=True)
          parts=[]
          for i in range(0,len(b64),8000):
            name=f'part-{i//8000+1:03d}.txt'
            (out/name).write_text(b64[i:i+8000],encoding='utf-8')
            parts.append(f'./releases/0.6.8/{name}')
          notes=[
            'Adds an updater-safe Windows start-bazaarflip.bat to the update bundle so older 0.6.5 installations can restart the new server instead of rolling back.',
            'This is a compatibility bridge specifically for desktops stuck on v0.6.5 after the 60-second restart timeout.',
            'Keeps the direct Node restart updater introduced in v0.6.6 for future updates.',
            'Includes all Minion Calculator fixes and global-search-rank behavior from v0.6.6 and v0.6.7.'
          ]
          manifest={
            'version':'0.6.8',
            'publishedAt':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=3))).isoformat(timespec='seconds'),
            'notes':notes,'files':[],
            'bundle':{'parts':parts,'encoding':'gzip-base64','sha256':hashlib.sha256(zipped).hexdigest()}
          }
          for rel in files:
            manifest['files'].append({'path':rel,'sha256':hashlib.sha256((src/rel).read_bytes()).hexdigest()})
          (repo/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit release
        run: |
          git config user.name bazaarflipper-update-bot
          git config user.email actions@users.noreply.github.com
          git rm -rf scratch-0.6.8 .github/workflows
          git add manifest.json releases/0.6.8
          git commit -m "release: BazaarFlipper v0.6.8"
          git push origin HEAD:v0.6.8-dev
